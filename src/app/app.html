<div class="nd-app min-vh-100 d-flex flex-column">
  <a href="#contenido" class="nd-skip-link">Saltar a la calculadora</a>
  <app-header></app-header>

  <main id="contenido" class="nd-container flex-grow-1" tabindex="-1">
    <header class="nd-hero">
      <div class="nd-hero-copy">
        <p class="nd-eyebrow">Nómina Docente Canarias</p>
        <h1>Tu nómina docente, clara.</h1>
        <p class="nd-hero-description">Calcula tu sueldo y entiende cada importe: la nómina del mes, tus pagas extras y la liquidación de tu contrato.</p>
      </div>
      <div class="nd-reference-note">
        <span class="nd-status-dot" aria-hidden="true"></span>
        <div><strong>Tablas de 2026</strong><span>Canarias · Simulación informativa</span></div>
      </div>
    </header>

    <section id="calculadora" class="nd-calculator" aria-label="Calculadora de nómina NODOCAN">
      <app-payroll-form (calculate)="onCalculate($event)"></app-payroll-form>
    </section>
    <div *ngIf="calculationError()" class="alert alert-danger mt-4" role="alert">{{ calculationError() }}</div>
    <app-payroll-result [result]="payrollResult()"></app-payroll-result>
    <router-outlet></router-outlet>
  </main>
  <app-footer></app-footer>
</div>
